<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <clipPath id="a-clip"><rect width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="a-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/><stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
    <linearGradient id="a-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c9486"/><stop offset="100%" stop-color="#5f5a52"/>
    </linearGradient>
    <linearGradient id="a-slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5261"/><stop offset="100%" stop-color="#2a2f3a"/>
    </linearGradient>
    <linearGradient id="a-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232634"/><stop offset="100%" stop-color="#15161f"/>
    </linearGradient>
    <pattern id="a-win" x="0" y="0" width="9" height="8" patternUnits="userSpaceOnUse">
      <rect x="3" y="2" width="3" height="4" fill="#f2c27a" opacity="0.85"/>
    </pattern>
    <filter id="a-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <g clip-path="url(#a-clip)">
    <rect width="800" height="200" fill="url(#a-bg)"/>
    <ellipse cx="400" cy="200" rx="330" ry="90" fill="#d08a3c" opacity="0.16" filter="url(#a-blur)"/>
    <ellipse cx="660" cy="10" rx="200" ry="100" fill="#6d7a93" opacity="0.1" filter="url(#a-blur)"/>
    <rect width="800" height="2" fill="#c9a36b" opacity="0.6"/>

    <text x="400" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="33" fill="#ffffff" font-weight="700" letter-spacing="1">awesome-comunidad-de-madrid</text>
    <rect x="250" y="52" width="300" height="2" rx="1" fill="#c9a36b" opacity="0.55"/>
    <text x="400" y="71" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.55" font-weight="300" letter-spacing="3">SOFTWARE OPEN SOURCE PARA LA COMUNIDAD DE MADRID</text>

    <!-- Monte Abantos behind the monastery -->
    <path d="M0,150 C60,146 110,132 170,122 C215,114 245,108 280,112 C330,118 360,136 420,142 C500,150 560,140 620,146 C690,152 750,148 800,154 L800,200 L0,200 Z" fill="url(#a-hill)"/>

    <!-- Real Monasterio de San Lorenzo de El Escorial, west front -->
    <g>
      <!-- basilica dome -->
      <rect x="383" y="112" width="34" height="30" fill="url(#a-stone)"/>
      <g fill="#1b1c24"><rect x="388" y="118" width="3" height="9" rx="1.5"/><rect x="395" y="118" width="3" height="9" rx="1.5"/><rect x="402" y="118" width="3" height="9" rx="1.5"/><rect x="409" y="118" width="3" height="9" rx="1.5"/></g>
      <rect x="381" y="110" width="38" height="3" fill="#2a2f3a"/>
      <path d="M384,110 A16,16 0 0 1 416,110 Z" fill="url(#a-slate)"/>
      <rect x="396.5" y="89" width="7" height="6" fill="url(#a-stone)"/>
      <polygon points="395.5,89 400,84 404.5,89" fill="#2a2f3a"/>
      <circle cx="400" cy="82.6" r="1.6" fill="#b9a27a"/>
      <rect x="399.5" y="77" width="1" height="4.5" fill="#b9a27a"/>
      <rect x="398.2" y="78.3" width="3.6" height="1" fill="#b9a27a"/>
      <!-- basilica body and bell towers -->
      <rect x="352" y="140" width="96" height="30" fill="url(#a-stone)"/>
      <g transform="translate(360,113)">
        <rect x="-9" y="0" width="18" height="28" fill="url(#a-stone)"/>
        <rect x="-3.5" y="4" width="7" height="9" rx="3.5" fill="#1b1c24"/>
        <rect x="-3.5" y="16" width="7" height="8" rx="3.5" fill="#1b1c24"/>
        <rect x="-10" y="-2" width="20" height="3" fill="#2a2f3a"/>
        <polygon points="-9,-2 0,-17 9,-2" fill="url(#a-slate)"/>
        <circle cx="0" cy="-19" r="1.8" fill="#b9a27a"/>
        <rect x="-0.5" y="-25" width="1" height="5" fill="#b9a27a"/>
        <rect x="-2" y="-23.5" width="4" height="1" fill="#b9a27a"/>
      </g>
      <g transform="translate(440,113)">
        <rect x="-9" y="0" width="18" height="28" fill="url(#a-stone)"/>
        <rect x="-3.5" y="4" width="7" height="9" rx="3.5" fill="#1b1c24"/>
        <rect x="-3.5" y="16" width="7" height="8" rx="3.5" fill="#1b1c24"/>
        <rect x="-10" y="-2" width="20" height="3" fill="#2a2f3a"/>
        <polygon points="-9,-2 0,-17 9,-2" fill="url(#a-slate)"/>
        <circle cx="0" cy="-19" r="1.8" fill="#b9a27a"/>
        <rect x="-0.5" y="-25" width="1" height="5" fill="#b9a27a"/>
        <rect x="-2" y="-23.5" width="4" height="1" fill="#b9a27a"/>
      </g>
      <rect x="351" y="138" width="98" height="3" fill="#2a2f3a"/>

      <!-- long west facade -->
      <polygon points="178,166 184,158 616,158 622,166" fill="url(#a-slate)"/>
      <rect x="178" y="166" width="444" height="30" fill="url(#a-stone)"/>
      <rect x="186" y="168" width="428" height="26" fill="url(#a-win)"/>

      <!-- main portal -->
      <rect x="376" y="150" width="48" height="46" fill="url(#a-stone)"/>
      <polygon points="372,151 400,138 428,151" fill="#8a8377"/>
      <rect x="372" y="150" width="56" height="2.5" fill="#4d4a45"/>
      <rect x="380" y="156" width="3" height="40" fill="#6c665d"/>
      <rect x="417" y="156" width="3" height="40" fill="#6c665d"/>
      <rect x="393" y="172" width="14" height="24" rx="7" fill="#1b1c24"/>
      <rect x="397" y="158" width="6" height="8" fill="#f2c27a" opacity="0.8"/>

      <!-- corner towers -->
      <rect x="164" y="138" width="26" height="58" fill="url(#a-stone)"/>
      <rect x="610" y="138" width="26" height="58" fill="url(#a-stone)"/>
      <g fill="#f2c27a" opacity="0.85">
        <rect x="175.5" y="146" width="3" height="4"/><rect x="175.5" y="158" width="3" height="4"/><rect x="175.5" y="170" width="3" height="4"/><rect x="175.5" y="182" width="3" height="4"/>
        <rect x="621.5" y="146" width="3" height="4"/><rect x="621.5" y="158" width="3" height="4"/><rect x="621.5" y="170" width="3" height="4"/><rect x="621.5" y="182" width="3" height="4"/>
      </g>
      <g transform="translate(177,138)">
        <rect x="-13" y="0" width="26" height="4" fill="#2a2f3a"/>
        <polygon points="-11,0 0,-24 11,0" fill="url(#a-slate)"/>
        <circle cx="0" cy="-26" r="2.2" fill="#b9a27a"/>
        <rect x="-0.6" y="-33" width="1.2" height="6" fill="#b9a27a"/>
        <rect x="-2.4" y="-31" width="4.8" height="1.1" fill="#b9a27a"/>
      </g>
      <g transform="translate(623,138)">
        <rect x="-13" y="0" width="26" height="4" fill="#2a2f3a"/>
        <polygon points="-11,0 0,-24 11,0" fill="url(#a-slate)"/>
        <circle cx="0" cy="-26" r="2.2" fill="#b9a27a"/>
        <rect x="-0.6" y="-33" width="1.2" height="6" fill="#b9a27a"/>
        <rect x="-2.4" y="-31" width="4.8" height="1.1" fill="#b9a27a"/>
      </g>
    </g>

    <!-- lonja (forecourt) -->
    <rect x="0" y="194" width="800" height="6" fill="#2b2a2e"/>
    <rect x="150" y="193" width="500" height="1.5" fill="#c9a36b" opacity="0.35"/>
  </g>
</svg>
